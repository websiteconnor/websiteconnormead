<script>
/* site açık temayla başlar; kullanıcı koyuyu seçerse o cihazda kalıcı olur */
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('cm_theme') || 'null') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'dark') {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#0a0a0b');
    }
    var h = JSON.parse(localStorage.getItem('cm_house') || 'null');
    if (h) document.documentElement.setAttribute('data-house', h);
  } catch (e) {}
})();
</script>
</head>
